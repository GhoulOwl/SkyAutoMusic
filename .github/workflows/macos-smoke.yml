name: macOS Transcription Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install macOS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-macos-lock.txt
      - name: Fetch separation model
        run: python scripts/fetch_separation_model.py
      - name: Run separation smoke test
        run: python scripts/smoke_separation.py
      - name: Generate fixture and run transcriber self-test
        run: |
          python tests/generate_transcriber_fixture.py transcriber-smoke.wav
          python -B play_music_gui.py --transcriber-self-test transcriber-smoke.wav
