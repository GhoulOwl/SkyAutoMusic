name: Build EXE & Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 显示名称（留空则使用 build-<序号>）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install pyinstaller==6.21.0

      - name: Verify ONNX transcription runtime
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('onnxruntime'), 'onnxruntime missing'; assert importlib.util.find_spec('tensorflow') is None, 'TensorFlow must not be bundled'"

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SkyAutoMusic `
            --hidden-import keyboard `
            --hidden-import win32timezone `
            --hidden-import interception `
            --collect-all basic_pitch `
            --collect-all onnxruntime `
            --collect-all interception `
            play_music_gui.py

      - name: Smoke-test packaged transcriber
        shell: pwsh
        run: |
          python tests/generate_transcriber_fixture.py transcriber-smoke.wav
          $process = Start-Process -FilePath "dist/SkyAutoMusic.exe" `
            -ArgumentList "--transcriber-self-test", (Resolve-Path "transcriber-smoke.wav").Path `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged transcriber self-test failed with exit code $($process.ExitCode)"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || format('Build {0}', github.run_number) }}
          files: dist/SkyAutoMusic.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
